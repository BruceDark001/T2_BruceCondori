<div class="container" style="padding: 20px;">
  <h2>Gestión de Productos</h2>
  
  <!-- Formulario de Registro -->
  <div class="card" style="margin-bottom: 20px; padding: 15px; background: #f9f9f9; border-radius: 8px; border: 1px solid #ddd;">
    <h3>Registrar Nuevo Producto</h3>
    <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px;">
      <input type="text" placeholder="Nombre" [(ngModel)]="nuevoProducto.nombre" style="padding: 6px;">
      <input type="text" placeholder="Categoría" [(ngModel)]="nuevoProducto.categoria" style="padding: 6px;">
      <input type="number" placeholder="Precio" [(ngModel)]="nuevoProducto.precio" style="padding: 6px;">
      <input type="number" placeholder="Stock" [(ngModel)]="nuevoProducto.stock" style="padding: 6px;">
      <input type="text" placeholder="Marca" [(ngModel)]="nuevoProducto.marca" style="padding: 6px;">
      <input type="text" placeholder="Código de Barras" [(ngModel)]="nuevoProducto.codigoBarras" style="padding: 6px;">
      <button (click)="guardarProducto()" style="padding: 6px 14px; background: #2563eb; color: white; border: none; border-radius: 4px; cursor: pointer;">Guardar</button>
    </div>
  </div>

  <!-- Tabla de Productos -->
  <table border="1" style="width: 100%; border-collapse: collapse; text-align: left;">
    <thead>
      <tr style="background: #eee;">
        <th style="padding: 10px;">ID</th>
        <th style="padding: 10px;">Nombre</th>
        <th style="padding: 10px;">Categoría</th>
        <th style="padding: 10px;">Precio</th>
        <th style="padding: 10px;">Stock</th>
        <th style="padding: 10px;">Marca</th>
        <th style="padding: 10px;">Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let p of productos">
        <td style="padding: 10px;">{{ p.id }}</td>
        <td style="padding: 10px;">{{ p.nombre }}</td>
        <td style="padding: 10px;">{{ p.categoria }}</td>
        <td style="padding: 10px;">S/ {{ p.precio }}</td>
        <td style="padding: 10px;">{{ p.stock }}</td>
        <td style="padding: 10px;">{{ p.marca }}</td>
        <td style="padding: 10px;">
          <button (click)="eliminar(p.id!)" style="background: #dc2626; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer;">Eliminar</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
